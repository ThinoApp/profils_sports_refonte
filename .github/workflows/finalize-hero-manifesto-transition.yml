name: Finalize Hero Manifesto Transition

on:
  push:
    branches:
      - feat/hero-manifesto-scroll-transition
    paths:
      - '.github/workflows/finalize-hero-manifesto-transition.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/hero-manifesto-scroll-transition
          fetch-depth: 0

      - name: Integrate transition assets and project copy
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          version = '20260903-hero1'
          index = Path('index.html')
          html = index.read_text()

          css_anchor = '  <link rel="stylesheet" href="styles.css" />'
          css_link = f'  <link rel="stylesheet" href="hero-manifesto-transition.css?v={version}" />'
          if css_link not in html:
              html = html.replace(css_anchor, css_anchor + '\n' + css_link, 1)

          script_anchor = '  <script src="script.js?v=20260903-cursor2"></script>'
          script_link = f'  <script src="hero-manifesto-transition.js?v={version}"></script>'
          if script_link not in html:
              html = html.replace(script_anchor, script_anchor + '\n' + script_link, 1)

          old_first = '''<p data-fr="Le repository révèle une proposition beaucoup plus complète que la landing actuelle : faisabilité, conception sur mesure, ingénierie normée, pilotage administratif et financier, réalisation, installation et maintenance." data-en="The repository reveals a much broader proposition than the current landing page: feasibility, bespoke design, standards-based engineering, administrative and financial steering, construction, installation and maintenance.">Le repository révèle une proposition beaucoup plus complète que la landing actuelle : faisabilité, conception sur mesure, ingénierie normée, pilotage administratif et financier, réalisation, installation et maintenance.</p>'''
          new_first = '''<p data-fr="De l'étude de faisabilité à la réception du chantier, Profils Sports relie conception, ingénierie, installation et exploitation dans un même cycle de projet." data-en="From feasibility studies to project handover, Profils Sports connects design, engineering, installation and operations within one project cycle.">De l'étude de faisabilité à la réception du chantier, Profils Sports relie conception, ingénierie, installation et exploitation dans un même cycle de projet.</p>'''

          old_second = '''<p data-fr="La V3 transforme ces informations en architecture de marque lisible, sans ajouter de projets, prix, certifications ou statistiques commerciales non vérifiés." data-en="V3 turns this information into a readable brand architecture without adding unverified projects, awards, certifications or commercial claims.">La V3 transforme ces informations en architecture de marque lisible, sans ajouter de projets, prix, certifications ou statistiques commerciales non vérifiés.</p>'''
          new_second = '''<p data-fr="Faisabilité ERP, accessibilité, Eurocodes, CAPEX / OPEX, HSE, contrôle qualité et DOE structurent une approche pensée pour la performance comme pour la durée." data-en="ERP feasibility, accessibility, Eurocodes, CAPEX / OPEX, HSE, quality control and as-built documentation structure an approach designed for both performance and longevity.">Faisabilité ERP, accessibilité, Eurocodes, CAPEX / OPEX, HSE, contrôle qualité et DOE structurent une approche pensée pour la performance comme pour la durée.</p>'''

          if old_first not in html or old_second not in html:
              raise SystemExit('Expected manifesto copy not found')
          html = html.replace(old_first, new_first, 1).replace(old_second, new_second, 1)
          index.write_text(html)

          decisions = Path('docs/DECISIONS.md')
          text = decisions.read_text()
          marker = '## 2026-09-03 — Hero and manifesto become one scroll-driven shared scene'
          if marker not in text:
              block = '''\n---\n\n## 2026-09-03 — Hero and manifesto become one scroll-driven shared scene\n\nDecision:\n\nThe homepage Hero and the following “De la conception à l’exploitation” section are treated as one continuous desktop scene. The Hero stays in a full-viewport coordinate system while a scroll-driven clip mask closes toward the real central media rectangle of the manifesto behind it.\n\nImplementation:\n\n- one normalized scroll progress drives the full transition\n- the Hero is cropped with `clip-path: inset()` rather than uniformly scaled\n- the manifesto already exists behind the Hero during the transition\n- the final mask geometry is measured from the actual central media bounding box\n- Hero video layers crossfade internally into an architectural project-plan media treatment only near the end\n- manifesto grid, marker, headline, copy and three project-cycle items reveal at separate progress ranges\n- the header changes theme without changing geometry\n- reverse scrolling is inherently reversible because every state is derived from the same scroll progress\n- mobile and `prefers-reduced-motion` retain the normal non-pinned Hero + manifesto flow\n\nRationale:\n\nThis creates a signature transition based on framing and continuity rather than decorative zooms, fades or page-transition effects, while translating the reference interaction into Profils Sports’ architecture / engineering language.\n'''
              text = text.replace('\n---\n\n## Future decision logging', block + '\n---\n\n## Future decision logging', 1)
              decisions.write_text(text)

          next_file = Path('docs/NEXT.md')
          next_text = next_file.read_text()
          bullet = '- connected the Hero and “De la conception à l’exploitation” manifesto through a single reversible scroll-driven clip/shared-media transition on desktop'
          if bullet not in next_text:
              anchor = '- replaced catalogue blueprint SVG swapping with one continuous spring-morphed SVG geometry that redirects from its current intermediate state on rapid hover changes'
              next_text = next_text.replace(anchor, anchor + '\n' + bullet, 1)
          next_file.write_text(next_text)
          PY

      - name: Validate implementation
        shell: bash
        run: |
          node --check hero-manifesto-transition.js
          node --check script.js
          grep -q 'hero-manifesto-transition.css?v=20260903-hero1' index.html
          grep -q 'hero-manifesto-transition.js?v=20260903-hero1' index.html
          grep -q 'clipPath = `inset' hero-manifesto-transition.js
          grep -q 'data-transition-media' hero-manifesto-transition.js
          grep -q "De l'étude de faisabilité" index.html
          git diff --check

      - name: Commit integrated branch
        shell: bash
        run: |
          git config user.name 'Profils Sports Agent'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html docs/DECISIONS.md docs/NEXT.md
          git commit -m 'feat: integrate scroll-driven hero manifesto scene'
          git push origin HEAD:feat/hero-manifesto-scroll-transition
