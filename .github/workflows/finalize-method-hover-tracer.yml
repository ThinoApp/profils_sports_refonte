name: Finalize Method Hover Tracer

on:
  push:
    branches:
      - feat/method-hover-tracer
    paths:
      - '.github/workflows/finalize-method-hover-tracer.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/method-hover-tracer
          fetch-depth: 0

      - name: Move tracer trigger from drag to method hover
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          js_path = Path('approach-drag-inspection.js')
          js = js_path.read_text()

          # The canvas becomes a neutral technical substrate only. The authored
          # method geometry must not exist before the tracer draws it.
          start = js.index('  const drawField = () => {')
          end = js.index('  const drawBlueprint = () => {')
          js = js[:start] + js[end:]

          predrawn = '''    ctx.save();\n    ctx.strokeStyle = 'rgba(239,225,88,.62)';\n    ctx.fillStyle = 'rgba(239,225,88,.82)';\n    ctx.lineWidth = 1.35;\n    if (state.geometry === 'field') drawField();\n    else if (state.geometry === 'structure') drawStructure();\n    else if (state.geometry === 'flow') drawFlow();\n    else if (state.geometry === 'delivery') drawDelivery();\n    else drawMaintenance();\n    ctx.restore();\n\n'''
          if predrawn not in js:
              raise SystemExit('predrawn geometry block not found')
          js = js.replace(predrawn, '', 1)

          js = js.replace(
              '<span class="approach-drag-hint">GLISSER POUR INSPECTER · LE TRACEUR CONSTRUIT LE PLAN</span>',
              '<span class="approach-drag-hint">SURVOLER UNE MÉTHODE · LE TRACEUR CONSTRUIT SON PLAN</span>'
          )
          js = js.replace(
              "      ? 'DRAG TO INSPECT · THE TRACER BUILDS THE DRAWING'\n      : 'GLISSER POUR INSPECTER · LE TRACEUR CONSTRUIT LE PLAN';",
              "      ? 'HOVER A METHOD · THE TRACER BUILDS ITS DRAWING'\n      : 'SURVOLER UNE MÉTHODE · LE TRACEUR CONSTRUIT SON PLAN';"
          )

          # Drag remains dedicated to the project/engineering split and no longer
          # starts or clears the drawing animation.
          js = js.replace('    startAnimation();\n    startTrace();\n  });', '    startAnimation();\n  });', 1)
          js = js.replace('    startAnimation();\n    stopTrace(false);\n  };', '    startAnimation();\n  };', 1)
          js = js.replace('    rebuildTrace();\n    if (dragging) startTrace();\n  };', '    rebuildTrace();\n  };', 1)

          old_rows = '''  rows.forEach((row, index) => {\n    const setStep = () => {\n      if (activeStep === index) return;\n      activeStep = index;\n      drawBlueprint();\n      rebuildTrace();\n      if (dragging) startTrace();\n    };\n    row.addEventListener('mouseenter', setStep);\n    row.addEventListener('focusin', setStep);\n  });\n'''
          new_rows = '''  rows.forEach((row, index) => {\n    const activateAndTrace = () => {\n      activeStep = index;\n      drawBlueprint();\n      rebuildTrace();\n      startTrace();\n    };\n    row.addEventListener('mouseenter', activateAndTrace);\n    row.addEventListener('focusin', activateAndTrace);\n  });\n'''
          if old_rows not in js:
              raise SystemExit('method row interaction block not found')
          js = js.replace(old_rows, new_rows, 1)

          js = js.replace(
              '      drawBlueprint();\n      rebuildTrace();\n      if (dragging) startTrace();',
              '      drawBlueprint();\n      rebuildTrace();',
              1
          )

          js_path.write_text(js)

          index_path = Path('index.html')
          index = index_path.read_text()
          index = index.replace('approach-drag-inspection.js?v=20260904-2', 'approach-drag-inspection.js?v=20260904-3')
          index_path.write_text(index)

          decisions_path = Path('docs/DECISIONS.md')
          decisions = decisions_path.read_text()
          marker = '## 2026-09-04 — Method tracer is hover-driven and geometry starts blank'
          if marker not in decisions:
              entry = '''\n---\n\n## 2026-09-04 — Method tracer is hover-driven and geometry starts blank\n\nDecision:\n\nTrigger the Method technical drawing animation from each Method list item rather than from the comparison drag gesture, and remove the pre-drawn technical figure before animation.\n\nImplementation:\n\n- entering or focusing any of the five Method rows resets and starts that row's tracer immediately\n- re-entering the currently active row also replays its drawing from zero\n- switching quickly between rows cancels the previous tracer and starts the new geometry cleanly\n- the engineering canvas keeps only its grid, frame, metadata and verified labels before the animation; the main field/structure/flow/delivery/maintenance figure is no longer painted underneath\n- the signal-yellow SVG tracer is therefore the only source of the primary technical geometry on enhanced desktop\n- completed geometry remains visible after the drawing pass until another Method is activated or the view is reset\n- dragging continues to control only the photo ↔ engineering split and no longer starts, stops or resets the tracer\n- keyboard focus mirrors hover for a usable non-pointer path\n- mobile and `prefers-reduced-motion` retain the original static blueprint fallback\n\nRationale:\n\nThe Method list itself is the semantic control for choosing a project phase, so the construction animation should respond to that choice directly. Removing the pre-drawn figure makes the tracer feel causal: the technical form genuinely appears because it is being constructed rather than being highlighted over an already finished drawing.\n'''
              decisions = decisions.replace('\n---\n\n## Future decision logging', entry + '\n---\n\n## Future decision logging', 1)
              decisions_path.write_text(decisions)

          next_path = Path('docs/NEXT.md')
          next_text = next_path.read_text()
          old = '- added a replayable signal-yellow Method tracer: every new drag redraws the active technical geometry with a dedicated cursor, curved pen-up transfers and a clean reset on drag release'
          new = '- moved the Method tracer from drag to Method-row hover/focus: each row now redraws its technical geometry from a genuinely blank technical substrate, while drag remains dedicated to the photo ↔ engineering split'
          if old in next_text:
              next_text = next_text.replace(old, new)
          elif new not in next_text:
              anchor = '- replaced the rejected liquid Method reveal with a precise hover + drag project/engineering split: a signal-yellow divider directly compares the photo with stage-specific technical drawings and keeps the original static fallback'
              if anchor in next_text:
                  next_text = next_text.replace(anchor, anchor + '\n' + new, 1)
              else:
                  next_text += '\n' + new + '\n'
          next_path.write_text(next_text)
          PY

      - name: Validate
        shell: bash
        run: |
          node --check approach-drag-inspection.js
          ! grep -q "const drawField" approach-drag-inspection.js
          ! grep -q "if (state.geometry === 'field') drawField" approach-drag-inspection.js
          grep -q "mouseenter', activateAndTrace" approach-drag-inspection.js
          grep -q "focusin', activateAndTrace" approach-drag-inspection.js
          grep -q 'HOVER A METHOD' approach-drag-inspection.js
          grep -q 'SURVOLER UNE MÉTHODE' approach-drag-inspection.js
          grep -q 'approach-drag-inspection.js?v=20260904-3' index.html
          grep -q 'Method tracer is hover-driven and geometry starts blank' docs/DECISIONS.md
          git diff --check

      - name: Commit hover tracer refinement
        shell: bash
        run: |
          git config user.name 'Profils Sports Agent'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add approach-drag-inspection.js index.html docs/DECISIONS.md docs/NEXT.md
          git commit -m 'feat: trigger method drawing on row hover'
          git push origin HEAD:feat/method-hover-tracer
