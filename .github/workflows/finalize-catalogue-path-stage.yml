name: Finalize Catalogue Path Stage Branch

on:
  push:
    branches:
      - feat/catalogue-path-stage
    paths:
      - '.github/workflows/finalize-catalogue-path-stage.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/catalogue-path-stage
          fetch-depth: 0

      - name: Bump cache and document the interaction
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          index = Path('index.html')
          html = index.read_text()
          html = html.replace('catalogue-particle-preview.css?v=20260903-3', 'catalogue-particle-preview.css?v=20260903-4')
          index.write_text(html)

          decisions = Path('docs/DECISIONS.md')
          text = decisions.read_text()
          marker = '## 2026-09-03 — Catalogue left column becomes a motion blueprint stage'
          block = '''## 2026-09-03 — Catalogue left column becomes a motion blueprint stage\n\nDecision:\n\nWhen the floating WebGL catalogue preview is active, the former static preview area in the left column remains occupied by an animated technical path scene rather than becoming empty.\n\nImplementation:\n\n- four authored SVG motion blueprints correspond to Fitness, Padel, CSP Pro and Canopy School\n- each route uses animated path drawing, moving markers, technical grid/crosshair language and signal-yellow wayfinding\n- the active blueprint follows the current catalogue hover/focus state\n- the floating WebGL image remains independent and continues to follow the cursor\n- touch / reduced-motion / WebGL fallback behavior remains unchanged\n\nRationale:\n\nThis fills the large negative space created by moving the catalogue image to the cursor while reinforcing the architecture / engineering / sports positioning instead of adding decorative particles or generic illustration.\n\n---\n\n'''
          if marker not in text:
              text = text.replace('## Future decision logging', block + '## Future decision logging', 1)
              decisions.write_text(text)

          next_file = Path('docs/NEXT.md')
          next_text = next_file.read_text()
          bullet = '- filled the catalogue left column with a catalogue-reactive animated SVG blueprint path stage while preserving the floating WebGL image preview'
          if bullet not in next_text:
              anchor = '- added explicit cache-busting version parameters for the catalogue WebGL module, CSS, local Three.js runtime and local cover textures after Safari kept executing the older CORS-dependent bundle'
              next_text = next_text.replace(anchor, anchor + '\n' + bullet, 1)
              next_file.write_text(next_text)
          PY

      - name: Validate
        shell: bash
        run: |
          grep -q 'catalogue-particle-preview.css?v=20260903-4' index.html
          grep -q 'cataloguePathScan' catalogue-particle-preview.css
          grep -q 'assets/catalogue-paths/fitness.svg' catalogue-particle-preview.css
          grep -q 'assets/catalogue-paths/padel.svg' catalogue-particle-preview.css
          grep -q 'assets/catalogue-paths/csp.svg' catalogue-particle-preview.css
          grep -q 'assets/catalogue-paths/canopy.svg' catalogue-particle-preview.css
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          for p in Path('assets/catalogue-paths').glob('*.svg'):
              ET.parse(p)
              print('valid', p)
          PY
          git diff --check

      - name: Commit final branch state
        shell: bash
        run: |
          git config user.name 'Profils Sports Agent'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html docs/DECISIONS.md docs/NEXT.md
          git commit -m 'docs: finalize catalogue path stage integration'
          git push origin HEAD:feat/catalogue-path-stage
