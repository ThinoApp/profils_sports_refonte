name: Stabilize Directional Cursor

on:
  push:
    branches:
      - fix/cursor-heading-stability
    paths:
      - '.github/workflows/stabilize-directional-cursor.yml'

permissions:
  contents: write

jobs:
  stabilize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/cursor-heading-stability
          fetch-depth: 0

      - name: Stabilize cursor heading
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          script_path = Path('script.js')
          js = script_path.read_text()

          old_vars = '''    let tx = innerWidth * .5;\n    let ty = innerHeight * .5;\n    let x = tx;\n    let y = ty;\n    let lastInputX = tx;\n    let lastInputY = ty;\n    let angle = -18;\n    let targetAngle = angle;\n    let speed = 0;\n    let visible = false;\n'''
          new_vars = '''    let tx = innerWidth * .5;\n    let ty = innerHeight * .5;\n    let x = tx;\n    let y = ty;\n    let sampledX = tx;\n    let sampledY = ty;\n    let directionX = 0;\n    let directionY = 0;\n    let pointerInitialized = false;\n    let angle = -18;\n    let targetAngle = angle;\n    let speed = 0;\n    let visible = false;\n'''

          old_handler = '''    const handlePointerMove = e => {\n      showCursor();\n      tx = e.clientX;\n      ty = e.clientY;\n\n      const vx = tx - lastInputX;\n      const vy = ty - lastInputY;\n      const instantaneousSpeed = Math.hypot(vx, vy);\n      speed = speed * .58 + instantaneousSpeed * .42;\n\n      // Update direction only while the pointer is actually travelling.\n      // At rest the dart keeps its last heading, like the supplied reference.\n      if (instantaneousSpeed > .65) {\n        targetAngle = Math.atan2(vy, vx) * 180 / Math.PI;\n      }\n\n      lastInputX = tx;\n      lastInputY = ty;\n    };\n\n    addEventListener('pointermove', handlePointerMove, { passive: true });\n    // Mousemove is kept as a compatibility safety net for browsers/environments\n    // that expose a fine mouse but do not dispatch Pointer Events consistently.\n    addEventListener('mousemove', handlePointerMove, { passive: true });\n'''
          new_handler = '''    const handlePointerMove = e => {\n      if (e.pointerType && e.pointerType !== 'mouse') return;\n\n      const nextX = e.clientX;\n      const nextY = e.clientY;\n      showCursor();\n\n      if (!pointerInitialized) {\n        pointerInitialized = true;\n        tx = nextX;\n        ty = nextY;\n        x = nextX;\n        y = nextY;\n        sampledX = nextX;\n        sampledY = nextY;\n        return;\n      }\n\n      tx = nextX;\n      ty = nextY;\n    };\n\n    if ('PointerEvent' in window) {\n      addEventListener('pointermove', handlePointerMove, { passive: true });\n    } else {\n      addEventListener('mousemove', handlePointerMove, { passive: true });\n    }\n'''

          old_tick = '''    const tickCursor = () => {\n      // Light positional inertia — enough to feel fluid without detaching the\n      // visual cursor from the user's real pointer.\n      x += (tx - x) * .42;\n      y += (ty - y) * .42;\n\n      const unwrappedTarget = shortestAngle(angle, targetAngle);\n      angle += (unwrappedTarget - angle) * .24;\n      speed *= .88;\n\n      // Tiny kinetic stretch at high velocity. At rest it returns to 1.\n      const stretch = 1 + clamp(speed / 115, 0, .16);\n      const squash = 1 - clamp(speed / 180, 0, .07);\n\n      if (cursor) {\n        cursor.style.transform = `translate3d(${x - 12}px,${y - 12}px,0) rotate(${angle}deg) scale(${stretch},${squash})`;\n      }\n      requestAnimationFrame(tickCursor);\n    };\n'''
          new_tick = '''    const tickCursor = () => {\n      const frameDX = tx - sampledX;\n      const frameDY = ty - sampledY;\n      sampledX = tx;\n      sampledY = ty;\n      const frameDistance = Math.hypot(frameDX, frameDY);\n\n      if (frameDistance > .18) {\n        const directionResponse = clamp(frameDistance / 12, .24, .5);\n        directionX += (frameDX - directionX) * directionResponse;\n        directionY += (frameDY - directionY) * directionResponse;\n\n        const directionMagnitude = Math.hypot(directionX, directionY);\n        if (directionMagnitude > .7) {\n          targetAngle = Math.atan2(directionY, directionX) * 180 / Math.PI;\n        }\n        speed = speed * .66 + frameDistance * .34;\n      } else {\n        directionX *= .86;\n        directionY *= .86;\n        speed *= .88;\n      }\n\n      x += (tx - x) * .56;\n      y += (ty - y) * .56;\n\n      const unwrappedTarget = shortestAngle(angle, targetAngle);\n      angle += (unwrappedTarget - angle) * .34;\n\n      const stretch = 1 + clamp(speed / 115, 0, .16);\n      const squash = 1 - clamp(speed / 180, 0, .07);\n\n      if (cursor) {\n        cursor.style.transform = `translate3d(${x - 12}px,${y - 12}px,0) rotate(${angle}deg) scale(${stretch},${squash})`;\n      }\n      requestAnimationFrame(tickCursor);\n    };\n'''

          for old, new, name in [
              (old_vars, new_vars, 'cursor variables'),
              (old_handler, new_handler, 'pointer handler'),
              (old_tick, new_tick, 'cursor RAF loop'),
          ]:
              if old not in js:
                  raise SystemExit(f'Missing expected {name} block')
              js = js.replace(old, new, 1)

          script_path.write_text(js)

          index_path = Path('index.html')
          html = index_path.read_text()
          html = html.replace('<script src="script.js"></script>', '<script src="script.js?v=20260903-cursor2"></script>', 1)
          index_path.write_text(html)

          next_path = Path('docs/NEXT.md')
          next_text = next_path.read_text()
          note = '- stabilized the directional cursor heading by sampling direction once per animation frame, filtering the movement vector and removing simultaneous pointermove/mousemove input'
          if note not in next_text:
              next_text += '\n' + note + '\n'
          next_path.write_text(next_text)
          PY

      - name: Validate
        shell: bash
        run: |
          node --check script.js
          grep -q "if ('PointerEvent' in window)" script.js
          grep -q 'const frameDX = tx - sampledX' script.js
          grep -q 'directionMagnitude > .7' script.js
          grep -q 'script.js?v=20260903-cursor2' index.html
          git diff --check

      - name: Commit fix
        shell: bash
        run: |
          git config user.name 'Profils Sports Agent'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add script.js index.html docs/NEXT.md
          git commit -m 'fix: stabilize directional cursor heading'
          git push origin HEAD:fix/cursor-heading-stability
