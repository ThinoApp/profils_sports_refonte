name: Finalize Method Content Hierarchy

on:
  push:
    branches:
      - feat/method-content-hierarchy
    paths:
      - '.github/workflows/finalize-method-content-hierarchy.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/method-content-hierarchy
          fetch-depth: 0

      - name: Refine Method information hierarchy
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          # ------------------------------------------------------------------
          # Method runtime: keep the technical face almost text-free.
          # ------------------------------------------------------------------
          js_path = Path('approach-drag-inspection.js')
          js = js_path.read_text()

          js = js.replace("    ctx.strokeStyle = 'rgba(239,225,88,.14)';", "    ctx.strokeStyle = 'rgba(239,225,88,.065)';", 1)

          ui_old = '''  ui.innerHTML = `\n    <span class="approach-drag-ui__photo">PROJET</span>\n    <span class="approach-drag-ui__technical">INGÉNIERIE</span>\n    <strong class="approach-drag-stage"></strong>\n    <span class="approach-drag-hint">SURVOLER UNE MÉTHODE · LE TRACEUR CONSTRUIT SON PLAN</span>\n  `;'''
          ui_new = '''  ui.innerHTML = `\n    <span class="approach-drag-ui__photo">PROJET</span>\n    <span class="approach-drag-ui__technical">INGÉNIERIE</span>\n  `;'''
          if ui_old not in js:
              raise SystemExit('Method UI block not found')
          js = js.replace(ui_old, ui_new, 1)

          js = js.replace("  handle.textContent = 'GLISSER';", "  handle.textContent = '';", 1)
          js = js.replace("  const stageLabel = ui.querySelector('.approach-drag-stage');\n", '')
          js = js.replace("  const hintLabel = ui.querySelector('.approach-drag-hint');\n", '')

          draw_pattern = re.compile(r"  const drawBlueprint = \(\) => \{.*?\n  \};\n\n  const fmt =", re.S)
          draw_replacement = '''  const drawBlueprint = () => {\n    if (!ctx) return;\n    const isEn = lang() === 'en';\n\n    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);\n    ctx.clearRect(0, 0, width, height);\n    ctx.fillStyle = '#07131f';\n    ctx.fillRect(0, 0, width, height);\n    drawGrid();\n\n    photoLabel.textContent = isEn ? 'PROJECT' : 'PROJET';\n    technicalLabel.textContent = isEn ? 'ENGINEERING' : 'INGÉNIERIE';\n    handle.textContent = '';\n  };\n\n  const fmt ='''
          js, count = draw_pattern.subn(draw_replacement, js, count=1)
          if count != 1:
              raise SystemExit('drawBlueprint block not replaced')

          js_path.write_text(js)

          # ------------------------------------------------------------------
          # Method-specific styling: hierarchy lives on the list, not the face.
          # ------------------------------------------------------------------
          css_path = Path('approach-drag-inspection.css')
          css = css_path.read_text()
          marker = '/* Method editorial hierarchy — figure first, explanation in the list. */'
          if marker not in css:
              css += '''\n\n/* Method editorial hierarchy — figure first, explanation in the list. */\n.project-system__summary {\n  align-self: end;\n  display: grid;\n  gap: 16px;\n  max-width: 590px;\n}\n\n.project-system__eyebrow {\n  display: inline-flex;\n  align-items: center;\n  gap: 12px;\n  width: max-content;\n  color: #efe158;\n  font-size: 8px;\n  font-weight: 800;\n  letter-spacing: .15em;\n  text-transform: uppercase;\n}\n\n.project-system__eyebrow::before {\n  content: "";\n  width: 30px;\n  height: 1px;\n  background: currentColor;\n}\n\n.project-system__summary p {\n  margin: 0 !important;\n  max-width: 48ch !important;\n  color: rgba(255,255,255,.76) !important;\n  font-size: clamp(14px,1.12vw,17px);\n  line-height: 1.55 !important;\n}\n\n.project-system__summary small {\n  max-width: 44ch;\n  color: rgba(255,255,255,.42);\n  font-size: 8px;\n  font-weight: 700;\n  line-height: 1.45;\n  letter-spacing: .11em;\n  text-transform: uppercase;\n}\n\n#approach [data-blueprint].approach-drag-ready .blueprint-photo {\n  inset: 0 !important;\n}\n\n#approach [data-blueprint].approach-drag-ready .blueprint-photo::after {\n  background: linear-gradient(90deg,rgba(9,21,33,.22),rgba(9,21,33,.05) 58%,transparent 78%);\n}\n\n.approach-drag-ui__photo,\n.approach-drag-ui__technical {\n  top: 16px;\n  font-size: 6px;\n  letter-spacing: .16em;\n  opacity: .64;\n}\n\n.approach-drag-ui__photo { left: 16px; }\n.approach-drag-ui__technical { right: 16px; }\n\n.approach-drag-stage,\n.approach-drag-hint {\n  display: none !important;\n}\n\n.approach-drag-divider {\n  background: rgba(239,225,88,.74);\n  transition: background .2s ease;\n}\n\n#approach [data-blueprint].is-dragging .approach-drag-divider {\n  background: rgba(239,225,88,.98);\n}\n\n.approach-drag-divider::before,\n.approach-drag-divider::after {\n  display: none;\n}\n\n.approach-drag-handle {\n  min-width: 42px;\n  width: 42px;\n  height: 42px;\n  padding: 0;\n  gap: 3px;\n  border-color: rgba(239,225,88,.48);\n  background: rgba(9,21,33,.88);\n  font-size: 0;\n}\n\n.approach-drag-handle::before,\n.approach-drag-handle::after {\n  font-size: 10px;\n}\n\n@media (min-width:900px) and (prefers-reduced-motion:no-preference) {\n  #approach:has([data-blueprint].approach-drag-ready) .approach-shell {\n    grid-template-columns: minmax(350px,.78fr) minmax(0,1.22fr);\n    gap: clamp(52px,6.5vw,104px);\n  }\n\n  #approach:has([data-blueprint].approach-drag-ready) .approach-list {\n    position: relative;\n    border-top: 0;\n  }\n\n  #approach:has([data-blueprint].approach-drag-ready) .approach-list::before {\n    content: "";\n    position: absolute;\n    left: 14px;\n    top: 29px;\n    bottom: 29px;\n    width: 1px;\n    background: rgba(255,255,255,.13);\n  }\n\n  #approach:has([data-blueprint].approach-drag-ready) .approach-row {\n    position: relative;\n    min-height: 88px;\n    display: grid;\n    grid-template-columns: 30px minmax(0,1fr);\n    gap: 0 18px;\n    align-items: start;\n    padding: 22px 0;\n    border-bottom: 1px solid rgba(255,255,255,.13);\n    background: transparent !important;\n    transition: padding .32s cubic-bezier(.18,.82,.18,1);\n  }\n\n  #approach:has([data-blueprint].approach-drag-ready) .approach-row:first-child {\n    border-top: 1px solid rgba(255,255,255,.13);\n  }\n\n  #approach:has([data-blueprint].approach-drag-ready) .approach-row::before {\n    content: "";\n    position: absolute;\n    left: 0;\n    top: 21px;\n    bottom: 21px;\n    width: 2px;\n    background: #efe158;\n    transform: scaleY(0);\n    transform-origin: center;\n    transition: transform .3s cubic-bezier(.18,.82,.18,1);\n  }\n\n  #approach:has([data-blueprint].approach-drag-ready) .approach-row > span {\n    position: relative;\n    z-index: 1;\n    width: 29px;\n    height: 29px;\n    padding: 0;\n    display: grid;\n    place-items: center;\n    border: 1px solid rgba(255,255,255,.22);\n    background: #091521;\n    color: rgba(255,255,255,.52);\n    font-size: 8px;\n    transition: background .28s ease,color .28s ease,border-color .28s ease;\n  }\n\n  #approach:has([data-blueprint].approach-drag-ready) .approach-row h3 {\n    align-self: center;\n    margin: 1px 0 0;\n    max-width: 18ch;\n    color: rgba(255,255,255,.72);\n    font-size: clamp(29px,2.4vw,41px);\n    line-height: .92;\n    transition: color .28s ease,transform .32s cubic-bezier(.18,.82,.18,1);\n  }\n\n  #approach:has([data-blueprint].approach-drag-ready) .approach-row p {\n    grid-column: 2;\n    max-width: 43ch;\n    max-height: 0;\n    margin: 0;\n    overflow: hidden;\n    color: rgba(255,255,255,.58);\n    font-size: 12px;\n    line-height: 1.55;\n    opacity: 0;\n    transform: translateY(-5px);\n    transition: max-height .38s cubic-bezier(.18,.82,.18,1),opacity .22s ease,transform .32s cubic-bezier(.18,.82,.18,1),margin .32s ease;\n  }\n\n  #approach:has([data-blueprint].approach-drag-ready) .approach-row.is-active,\n  #approach:has([data-blueprint].approach-drag-ready) .approach-row:hover,\n  #approach:has([data-blueprint].approach-drag-ready) .approach-row:focus-within {\n    padding: 26px 0 28px 14px;\n  }\n\n  #approach:has([data-blueprint].approach-drag-ready) .approach-row.is-active::before,\n  #approach:has([data-blueprint].approach-drag-ready) .approach-row:hover::before,\n  #approach:has([data-blueprint].approach-drag-ready) .approach-row:focus-within::before {\n    transform: scaleY(1);\n  }\n\n  #approach:has([data-blueprint].approach-drag-ready) .approach-row.is-active > span,\n  #approach:has([data-blueprint].approach-drag-ready) .approach-row:hover > span,\n  #approach:has([data-blueprint].approach-drag-ready) .approach-row:focus-within > span {\n    background: #efe158;\n    border-color: #efe158;\n    color: #091521;\n  }\n\n  #approach:has([data-blueprint].approach-drag-ready) .approach-row.is-active h3,\n  #approach:has([data-blueprint].approach-drag-ready) .approach-row:hover h3,\n  #approach:has([data-blueprint].approach-drag-ready) .approach-row:focus-within h3 {\n    color: #fff;\n    transform: translateX(2px);\n  }\n\n  #approach:has([data-blueprint].approach-drag-ready) .approach-row.is-active p,\n  #approach:has([data-blueprint].approach-drag-ready) .approach-row:hover p,\n  #approach:has([data-blueprint].approach-drag-ready) .approach-row:focus-within p {\n    max-height: 92px;\n    margin-top: 13px;\n    opacity: 1;\n    transform: none;\n  }\n\n  #approach:has([data-blueprint].approach-drag-ready) .approach-row:focus-visible {\n    outline: 1px solid rgba(239,225,88,.55);\n    outline-offset: 5px;\n  }\n}\n\n@media (max-width:899px) {\n  .project-system__summary {\n    margin-top: 28px;\n  }\n}\n'''
              css_path.write_text(css)

          # ------------------------------------------------------------------
          # Production-facing copy and interaction hint live outside the media.
          # ------------------------------------------------------------------
          index_path = Path('index.html')
          index = index_path.read_text()
          old_lead = '''        <p data-fr="La section Approche itérative du projet apporte la profondeur qui manquait au site public : étude amont, ingénierie, finance, chantier et contrôle. Ce sont ces éléments qui positionnent Profils Sports comme partenaire de projet." data-en="The project's iterative approach adds the depth missing from the public site: upfront study, engineering, finance, construction and control. These elements position Profils Sports as a project partner.">La section Approche itérative du projet apporte la profondeur qui manquait au site public : étude amont, ingénierie, finance, chantier et contrôle. Ce sont ces éléments qui positionnent Profils Sports comme partenaire de projet.</p>'''
          new_lead = '''        <div class="project-system__summary">\n          <span class="project-system__eyebrow" data-fr="05 ÉTAPES · 01 CYCLE" data-en="05 STAGES · 01 CYCLE">05 ÉTAPES · 01 CYCLE</span>\n          <p data-fr="Faisabilité, Eurocodes, CAPEX / OPEX, chantier, HSE, DOE et maintenance structurent le projet de l'amont à l'exploitation." data-en="Feasibility, Eurocodes, CAPEX / OPEX, construction, HSE, handover documentation and maintenance structure the project from early studies through operations.">Faisabilité, Eurocodes, CAPEX / OPEX, chantier, HSE, DOE et maintenance structurent le projet de l'amont à l'exploitation.</p>\n          <small data-fr="Survolez une étape — sa logique technique se construit à droite." data-en="Hover a stage — its technical logic is constructed on the right.">Survolez une étape — sa logique technique se construit à droite.</small>\n        </div>'''
          if old_lead not in index:
              raise SystemExit('Method lead paragraph not found')
          index = index.replace(old_lead, new_lead, 1)
          index = index.replace('data-approach-row data-code=', 'data-approach-row tabindex="0" data-code=')
          index = index.replace('approach-drag-inspection.css?v=20260904-2', 'approach-drag-inspection.css?v=20260904-4')
          index = index.replace('approach-drag-inspection.js?v=20260904-3', 'approach-drag-inspection.js?v=20260904-4')
          index_path.write_text(index)

          # ------------------------------------------------------------------
          # Handoff docs.
          # ------------------------------------------------------------------
          decisions_path = Path('docs/DECISIONS.md')
          decisions = decisions_path.read_text()
          decision_marker = '## 2026-09-04 — Method content lives in the list; the drawing face stays quiet'
          if decision_marker not in decisions:
              entry = '''\n---\n\n## 2026-09-04 — Method content lives in the list; the drawing face stays quiet\n\nDecision:\n\nMake the Method section understandable at a glance by separating explanation from visualisation. The list owns hierarchy and explanatory copy; the technical media owns the drawing.\n\nImplementation:\n\n- replace the prototype/meta lead paragraph with a concise verified summary of the five-stage project cycle and put the hover instruction beside that copy, outside the technical media\n- turn the Method list into a visible 01→05 sequence with a restrained connecting rail\n- inactive rows show only number + title; the active/hovered/focused row expands its existing verified explanatory sentence\n- make Method rows keyboard-focusable so the same active state and drawing trigger can be reached without hover\n- remove the canvas title, stage counter and six technical keyword labels from the engineering face\n- remove the large repeated active-stage title and interaction hint from the media overlay\n- retain only micro `PROJET` / `INGÉNIERIE` labels, the split line, compact drag handle, faint grid and cursor-drawn geometry\n- make the project image full-bleed within the comparison frame so project and engineering read as two states of the same surface\n- keep drag behaviour, hover-triggered tracer geometry, mobile fallback and reduced-motion fallback unchanged\n\nRationale:\n\nThe previous media repeated the active title, instruction, metadata and technical vocabulary on top of the animated figure. That made the user decode an interface before understanding the idea. The revised hierarchy makes the concept immediate: choose one of five project phases on the left and watch its technical system construct itself on the right.\n'''
              decisions = decisions.replace('\n---\n\n## Future decision logging', entry + '\n---\n\n## Future decision logging', 1)
              decisions_path.write_text(decisions)

          next_path = Path('docs/NEXT.md')
          next_text = next_path.read_text()
          bullet = '- clarified the Method information hierarchy: the five-step list now carries the explanation and expands only the active row, while the technical face is reduced to a quiet grid, split comparison and cursor-drawn figure'
          if bullet not in next_text:
              anchor = '- moved the Method tracer from drag to Method-row hover/focus: each row now redraws its technical geometry from a genuinely blank technical substrate, while drag remains dedicated to the photo ↔ engineering split'
              if anchor in next_text:
                  next_text = next_text.replace(anchor, anchor + '\n' + bullet, 1)
              else:
                  next_text += '\n' + bullet + '\n'
          next_path.write_text(next_text)
          PY

      - name: Validate
        shell: bash
        run: |
          node --check approach-drag-inspection.js
          ! grep -q 'PROFILS SPORTS / PROJECT SYSTEM' approach-drag-inspection.js
          ! grep -q 'stageLabel.textContent' approach-drag-inspection.js
          ! grep -q 'hintLabel.textContent' approach-drag-inspection.js
          grep -q 'project-system__summary' index.html
          grep -q '05 ÉTAPES · 01 CYCLE' index.html
          grep -q 'data-approach-row tabindex="0"' index.html
          grep -q 'approach-drag-inspection.css?v=20260904-4' index.html
          grep -q 'approach-drag-inspection.js?v=20260904-4' index.html
          grep -q 'Method content lives in the list' docs/DECISIONS.md
          git diff --check

      - name: Commit hierarchy refinement
        shell: bash
        run: |
          git config user.name 'Profils Sports Agent'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add approach-drag-inspection.js approach-drag-inspection.css index.html docs/DECISIONS.md docs/NEXT.md
          git commit -m 'feat: clarify method content hierarchy'
          git push origin HEAD:feat/method-content-hierarchy
