name: Apply V4 Motion System

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-v4.yml'

permissions:
  contents: write

jobs:
  apply-v4:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply V4 implementation patch
        shell: bash
        run: |
          base64 -d .github/v4-final.patch.gz.b64 | gzip -d > /tmp/v4.patch
          git apply --check /tmp/v4.patch
          git apply /tmp/v4.patch

      - name: Update agent handoff documentation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          agents = Path('AGENTS.md')
          text = agents.read_text()
          text = text.replace('Preserve the current V3 visual language unless the user explicitly requests a new direction.', 'Preserve the current V4 visual and motion language unless the user explicitly requests a new direction.')
          text = text.replace('The current redesign is V3 and is already deployed on GitHub Pages.', 'The current redesign is V4 and is deployed through GitHub Pages.')
          if '- hero drag / inspection interaction' not in text:
              text = text.replace('- cinematic hero treatment\n', '- cinematic hero treatment\n- hero drag / inspection interaction\n- state-based Method scrollytelling\n- architectural anchor transitions\n')
          agents.write_text(text)

          context = Path('docs/PROJECT_CONTEXT.md')
          text = context.read_text()
          text = text.replace('The current active implementation is V3.', 'The current active implementation is V4.')
          text = text.replace('Current V3 homepage', 'Current V4 homepage')
          text = text.replace('Current V3 includes:', 'Current V4 includes:')
          text = text.replace('Current V3', 'Current V4')
          marker = '## V4 motion system\n'
          if marker not in text:
              text += '''\n\n## V4 motion system\n\nV4 keeps the approved V3 visual world and adds a more state-driven motion grammar inspired by the interaction principles observed on Heron AI, without copying its visual identity.\n\nKey additions:\n\n- a hero drag inspector that moves through PHOTO → PLAN → STRUCTURE → SURFACE → ÉQUIPEMENTS\n- the directional cursor becomes a horizontal drag instrument inside the inspector\n- the solutions carousel keeps its protected horizontal sticky behavior and adds subtle multi-speed depth between media, copy and numbering\n- the Method section becomes a long sticky scrollytelling sequence where the technical project builds across five verified lifecycle states\n- anchor navigation uses a short architectural blue-black wipe with a signal-yellow construction line\n- motion remains disabled or simplified under `prefers-reduced-motion`\n- the native cursor fallback remains mandatory when the custom cursor cannot safely run\n\nThe interaction system should remain purposeful: motion communicates project state, inspection, progression or navigation rather than adding decorative effects.\n'''
          context.write_text(text)

          decisions = Path('docs/DECISIONS.md')
          text = decisions.read_text()
          entry = '''\n\n---\n\n## 2026-09-03 — V4 introduces state-driven motion and hero inspection\n\nDecision:\n\nKeep the approved V3 visual identity, but evolve the implementation to V4 with a stronger state-based motion system.\n\nApproved additions:\n\n- hero `DRAG TO INSPECT` experience: PHOTO → PLAN → STRUCTURE → SURFACE → ÉQUIPEMENTS\n- directional cursor changes into a horizontal drag instrument in the inspector\n- subtle three-speed depth inside the protected horizontal solutions carousel\n- sticky Method scrollytelling across the five verified project lifecycle stages\n- short architectural anchor-transition wipe using the existing blue-black and signal-yellow language\n\nRationale:\n\nMotion should transform technical information into an experience rather than behave as generic decoration. The interaction language borrows the principle of stateful inspection / progression from the Heron reference while remaining specific to Profils Sports.\n\nConstraints:\n\n- do not remove the robust native cursor fallback\n- preserve `prefers-reduced-motion` handling\n- do not invent project claims or technical data to make animations feel richer\n- keep the horizontal carousel as a protected interaction\n'''
          if 'V4 introduces state-driven motion and hero inspection' not in text:
              text += entry
          decisions.write_text(text)

          Path('docs/NEXT.md').write_text('''# Current State / Next — Profils Sports Refonte\n\nLast updated: 2026-09-03\n\n## Current version\n\nV4 redesign deployed through GitHub Pages.\n\nLive preview:\n\n`https://thinoapp.github.io/profils_sports_refonte/`\n\nPrimary branch:\n\n`main`\n\n## Recently completed\n\n- moved the active redesign workflow to `ThinoApp/profils_sports_refonte`\n- configured GitHub Pages deployment through GitHub Actions\n- established repository-backed homepage content from verified legacy sources\n- preserved the horizontal sticky solutions carousel\n- implemented and hardened the directional dart cursor with native fallback\n- added the V4 hero `DRAG TO INSPECT` experience\n- made the cursor become a horizontal drag instrument inside the inspector\n- added PHOTO → PLAN → STRUCTURE → SURFACE → ÉQUIPEMENTS inspection states\n- added subtle multi-speed depth to the horizontal solutions carousel\n- transformed the Method section into state-based sticky scrollytelling\n- added architectural anchor transitions\n- documented the V4 interaction decisions for future agents\n\n## Current implementation files\n\n- `index.html`\n- `styles.css`\n- `script.js`\n- `repo-data.json`\n\n## Current priorities\n\n1. Validate V4 visually on the live GitHub Pages build, especially hero composition and cursor behavior.\n2. Tune the hero inspector scale/position after testing on common desktop viewport sizes.\n3. Validate the long Method scrollytelling pacing and reduce its scroll length if it feels too slow.\n4. Polish responsive behavior for the hero inspector, carousel and large typography on tablet/mobile.\n5. Build a proper Project / Reference page template once real verified project data is available.\n6. Build a richer Catalogue detail / browsing experience using the real catalogue page sequences.\n7. Continue replacing generic/legacy media with verified Profils Sports project imagery when available.\n\n## Protected V4 interactions\n\nDo not remove or fundamentally redesign without explicit discussion:\n\n- horizontal sticky solutions carousel\n- directional dart cursor and its native fallback\n- hero drag inspector\n- PHOTO → PLAN → STRUCTURE → SURFACE → ÉQUIPEMENTS state model\n- Method scrollytelling\n- architectural blueprint language\n- signal yellow `#EFE158`\n\n## Known issues / watch points\n\n### Cursor\n\nThe custom cursor must only hide the native cursor after successful fine-pointer detection. V4 uses `any-pointer:fine`, pointer + mouse movement compatibility handling, and restores the native cursor when the custom cursor is unavailable.\n\nInside the hero inspector, the cursor changes from a directional dart into a horizontal double-arrow / drag instrument and expands while dragging.\n\n### Hero inspector\n\nThe interaction supports pointer drag and keyboard arrows/Home/End. On reduced-motion environments the technical state is revealed without relying on motion.\n\nThe inspector currently uses existing Profils Sports imagery as its photographic base rather than fabricated project media.\n\n### External media\n\nThe refonte still references several assets directly from `www.profilssports.com`. A later production-hardening pass should decide whether approved assets are copied locally or moved to a durable asset host.\n\n### Data quality\n\nDo not reuse demo content from legacy references/partners pages as factual projects, awards, budgets, certifications or client claims.\n\n## Handoff instructions for a new conversation\n\nRecommended opening prompt:\n\n> Work on `ThinoApp/profils_sports_refonte`. Read `AGENTS.md`, `docs/PROJECT_CONTEXT.md`, `docs/DECISIONS.md` and `docs/NEXT.md` first. The repository is the source of truth. Then fetch the latest implementation files before making changes.\n\nIf this file conflicts with the actual current repository implementation, treat the repository code and latest commits as authoritative and update this file accordingly.\n''')
          PY

      - name: Validate implementation
        shell: bash
        run: |
          node --check script.js
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          html = Path('index.html').read_text()
          css = Path('styles.css').read_text()

          class Parser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.ids = []
                  self.hrefs = []
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if 'id' in attrs:
                      self.ids.append(attrs['id'])
                  if tag == 'a' and attrs.get('href', '').startswith('#'):
                      self.hrefs.append(attrs['href'][1:])

          parser = Parser()
          parser.feed(html)
          assert len(parser.ids) == len(set(parser.ids)), 'Duplicate IDs found'
          ids = set(parser.ids)
          missing = [h for h in parser.hrefs if h and h not in ids]
          assert not missing, f'Missing anchor targets: {missing}'
          assert css.count('{') == css.count('}'), 'Unbalanced CSS braces'
          assert 'data-hero-inspector' in html
          assert 'data-approach-story' in html
          assert "matchMedia('(any-pointer:fine)')" in Path('script.js').read_text()
          print('V4 validation passed')
          PY

      - name: Commit V4
        shell: bash
        run: |
          git config user.name 'Profils Sports Agent'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html styles.css script.js AGENTS.md docs/PROJECT_CONTEXT.md docs/DECISIONS.md docs/NEXT.md
          git commit -m 'feat: add V4 motion system and hero inspector'
          git push origin HEAD:main
