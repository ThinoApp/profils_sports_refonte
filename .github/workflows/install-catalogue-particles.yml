      - name: Integrate module and update handoff docs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          index = Path('index.html')
          html = index.read_text()
          script_tag = '  <script src="catalogue-particle-preview.js"></script>'
          anchor = '  <script src="script.js"></script>'
          if script_tag not in html:
              if anchor not in html:
                  raise SystemExit('script.js anchor not found')
              html = html.replace(anchor, anchor + '\n' + script_tag, 1)
              index.write_text(html)

          decisions = Path('docs/DECISIONS.md')
          decision_text = decisions.read_text()
          marker = '## 2026-09-03 — Catalogue preview becomes a localized WebGL interaction'
          if marker not in decision_text:
              block = '''\n---\n\n## 2026-09-03 — Catalogue preview becomes a localized WebGL interaction\n\nDecision:\n\nApply the cursor-follow particle transition only to the `#catalogues` section. Keep the hero, horizontal solutions carousel, approach, clients and contact interactions unchanged.\n\nImplementation:\n\n- floating preview follows the pointer through `requestAnimationFrame` interpolation\n- Three.js + custom `ShaderMaterial` + `THREE.Points` render the transition\n- outgoing and incoming particle systems overlap temporally\n- stable states use sharp texture planes rather than visible particle mosaics\n- catalogue textures are preloaded before WebGL mode is enabled\n- the existing static catalogue preview remains the fallback for touch, reduced motion, WebGL/CORS failure and keyboard use\n\nCalibration note:\n\nThe supplied written prompt defines the required architecture and starting parameters, but the reference video for this specific particle effect has not been supplied in the current handoff. The current values are therefore an initial implementation baseline and must be calibrated against that video before claiming exact visual/timing parity.\n'''
              future = '\n---\n\n## Future decision logging'
              if future in decision_text:
                  decision_text = decision_text.replace(future, block + future, 1)
              else:
                  decision_text += block
              decisions.write_text(decision_text)

          next_file = Path('docs/NEXT.md')
          next_text = next_file.read_text()
          bullet = '- added a localized WebGL particle preview to the catalogue list with cursor inertia, outgoing/incoming overlap and static fallback'
          if bullet not in next_text:
              anchor = '- documented agent handoff context in `AGENTS.md` and `/docs`'
              if anchor in next_text:
                  next_text = next_text.replace(anchor, anchor + '\n' + bullet, 1)
              else:
                  next_text += '\n' + bullet + '\n'
          note_marker = '### Catalogue particle preview'
          if note_marker not in next_text:
              insert = '''\n### Catalogue particle preview\n\nDesktop fine-pointer users get a floating WebGL preview while hovering Fitness, Padel, CSP Pro and Canopy School. The preview follows the cursor with inertia and transitions between covers through overlapping outgoing/incoming particles.\n\nThe current tuning is based on the written reverse-engineering specification only. Exact size, offset, particle density, scatter radius, duration and easing still need frame-by-frame calibration once the specific reference video is available.\n\nThe original static catalogue preview is intentionally preserved as the fallback.\n'''
              known = '## Do not change without discussion'
              if known in next_text:
                  next_text = next_text.replace(known, insert + '\n' + known, 1)
              else:
                  next_text += insert
          next_file.write_text(next_text)
          PY

      - name: Validate files
        shell: bash
        run: |
          node --check catalogue-particle-preview.js
          grep -q 'catalogue-particle-preview.js' index.html
          grep -q 'catalogue-particle-ready' catalogue-particle-preview.css
          git diff --check

      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "Profils Sports Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html catalogue-particle-preview.js catalogue-particle-preview.css docs/DECISIONS.md docs/NEXT.md
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "feat: add WebGL particle preview to catalogues"
          git push
