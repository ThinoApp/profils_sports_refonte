name: Finalize Impact Intro

on:
  push:
    branches:
      - feat/impact-intro-curtain
    paths:
      - '.github/workflows/finalize-impact-intro.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/impact-intro-curtain
          fetch-depth: 0

      - name: Integrate intro assets and documentation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          version = '20260903-intro1'
          index = Path('index.html')
          html = index.read_text()

          css_anchor = '  <link rel="stylesheet" href="styles.css" />'
          css_link = f'  <link rel="stylesheet" href="impact-intro.css?v={version}" />'
          if css_link not in html:
              html = html.replace(css_anchor, css_anchor + '\n' + css_link, 1)

          script_anchor = '  <script src="script.js?v=20260903-cursor2"></script>'
          script_link = f'  <script src="impact-intro.js?v={version}"></script>'
          if script_link not in html:
              html = html.replace(script_anchor, script_link + '\n' + script_anchor, 1)

          index.write_text(html)

          decisions = Path('docs/DECISIONS.md')
          text = decisions.read_text()
          marker = '## 2026-09-03 — Intro becomes a construction curtain'
          if marker not in text:
              block = '''\n---\n\n## 2026-09-03 — Intro becomes a construction curtain\n\nDecision:\n\nReplace the basic wordmark loader with a short branded opening sequence that behaves like the construction of a sports field and opens directly onto the Hero.\n\nImplementation:\n\n- architectural grid and cross-axis lines appear first\n- monumental PROFILS / SPORTS lockup enters through masked typography\n- signal-yellow field marking grows across the viewport\n- a subtle stadium-plan ellipse reinforces the sports/infrastructure theme\n- progress is shown as a restrained numeric construction indicator\n- two dark architectural curtains separate and reveal the already-running Hero beneath\n- the intro is capped at roughly 2.3 seconds and never waits indefinitely on media\n- reduced-motion skips the sequence entirely\n\nRationale:\n\nThe intro should establish the brand world immediately rather than behave like a generic loading screen. The movement borrows best-practice patterns from award-winning web intros (masked type, staged graphic construction, split reveal) while keeping the visual language specific to Profils Sports.\n'''
              text = text.replace('\n---\n\n## Future decision logging', block + '\n---\n\n## Future decision logging', 1)
              decisions.write_text(text)

          next_file = Path('docs/NEXT.md')
          next_text = next_file.read_text()
          bullet = '- replaced the basic preloader with a branded construction-curtain intro: architectural grid, monumental masked type, signal field line and split reveal into the live Hero'
          if bullet not in next_text:
              anchor = '- connected the Hero and “De la conception à l’exploitation” manifesto through a single reversible scroll-driven clip/shared-media transition on desktop'
              next_text = next_text.replace(anchor, anchor + '\n' + bullet, 1)
          next_file.write_text(next_text)
          PY

      - name: Validate
        shell: bash
        run: |
          node --check impact-intro.js
          node --check script.js
          grep -q 'impact-intro.css?v=20260903-intro1' index.html
          grep -q 'impact-intro.js?v=20260903-intro1' index.html
          grep -q 'intro-upgraded.is-opening' impact-intro.css
          grep -q 'latestOpenAt = 2300' impact-intro.js
          git diff --check

      - name: Commit integrated branch
        shell: bash
        run: |
          git config user.name 'Profils Sports Agent'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html docs/DECISIONS.md docs/NEXT.md
          git commit -m 'feat: integrate impact construction intro'
          git push origin HEAD:feat/impact-intro-curtain
