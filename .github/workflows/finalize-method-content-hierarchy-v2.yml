name: Finalize Method Content Hierarchy V2

on:
  push:
    branches:
      - feat/method-content-hierarchy-v2
    paths:
      - '.github/workflows/finalize-method-content-hierarchy-v2.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/method-content-hierarchy-v2
          fetch-depth: 0

      - name: Apply Method hierarchy without touching concurrent Catalogue work
        shell: bash
        run: |
          git fetch origin feat/method-content-hierarchy
          git show origin/feat/method-content-hierarchy:approach-drag-inspection.js > approach-drag-inspection.js
          git show origin/feat/method-content-hierarchy:approach-drag-inspection.css > approach-drag-inspection.css

          python - <<'PY'
          from pathlib import Path

          index_path = Path('index.html')
          index = index_path.read_text()
          old_lead = '''        <p data-fr="La section Approche itérative du projet apporte la profondeur qui manquait au site public : étude amont, ingénierie, finance, chantier et contrôle. Ce sont ces éléments qui positionnent Profils Sports comme partenaire de projet." data-en="The project's iterative approach adds the depth missing from the public site: upfront study, engineering, finance, construction and control. These elements position Profils Sports as a project partner.">La section Approche itérative du projet apporte la profondeur qui manquait au site public : étude amont, ingénierie, finance, chantier et contrôle. Ce sont ces éléments qui positionnent Profils Sports comme partenaire de projet.</p>'''
          new_lead = '''        <div class="project-system__summary">\n          <span class="project-system__eyebrow" data-fr="05 ÉTAPES · 01 CYCLE" data-en="05 STAGES · 01 CYCLE">05 ÉTAPES · 01 CYCLE</span>\n          <p data-fr="Faisabilité, Eurocodes, CAPEX / OPEX, chantier, HSE, DOE et maintenance structurent le projet de l'amont à l'exploitation." data-en="Feasibility, Eurocodes, CAPEX / OPEX, construction, HSE, handover documentation and maintenance structure the project from early studies through operations.">Faisabilité, Eurocodes, CAPEX / OPEX, chantier, HSE, DOE et maintenance structurent le projet de l'amont à l'exploitation.</p>\n          <small data-fr="Survolez une étape — sa logique technique se construit à droite." data-en="Hover a stage — its technical logic is constructed on the right.">Survolez une étape — sa logique technique se construit à droite.</small>\n        </div>'''
          if old_lead not in index and 'project-system__summary' not in index:
              raise SystemExit('Method lead paragraph not found')
          if old_lead in index:
              index = index.replace(old_lead, new_lead, 1)
          index = index.replace('data-approach-row data-code=', 'data-approach-row tabindex="0" data-code=')
          index = index.replace('approach-drag-inspection.css?v=20260904-2', 'approach-drag-inspection.css?v=20260904-4')
          index = index.replace('approach-drag-inspection.js?v=20260904-3', 'approach-drag-inspection.js?v=20260904-4')
          index_path.write_text(index)

          decisions_path = Path('docs/DECISIONS.md')
          decisions = decisions_path.read_text()
          marker = '## 2026-09-04 — Method content lives in the list; the drawing face stays quiet'
          if marker not in decisions:
              entry = '''\n---\n\n## 2026-09-04 — Method content lives in the list; the drawing face stays quiet\n\nDecision:\n\nMake the Method section understandable at a glance by separating explanation from visualisation. The list owns hierarchy and explanatory copy; the technical media owns the drawing.\n\nImplementation:\n\n- replace the prototype/meta lead paragraph with a concise verified summary of the five-stage project cycle and put the hover instruction beside that copy, outside the technical media\n- turn the Method list into a visible 01→05 sequence with a restrained connecting rail\n- inactive rows show only number + title; the active/hovered/focused row expands its existing verified explanatory sentence\n- make Method rows keyboard-focusable so the same active state and drawing trigger can be reached without hover\n- remove the canvas title, stage counter and six technical keyword labels from the engineering face\n- remove the large repeated active-stage title and interaction hint from the media overlay\n- retain only micro `PROJET` / `INGÉNIERIE` labels, the split line, compact drag handle, faint grid and cursor-drawn geometry\n- make the project image full-bleed within the comparison frame so project and engineering read as two states of the same surface\n- keep drag behaviour, hover-triggered tracer geometry, mobile fallback and reduced-motion fallback unchanged\n\nRationale:\n\nThe previous media repeated the active title, instruction, metadata and technical vocabulary on top of the animated figure. That made the user decode an interface before understanding the idea. The revised hierarchy makes the concept immediate: choose one of five project phases on the left and watch its technical system construct itself on the right.\n'''
              decisions = decisions.replace('\n---\n\n## Future decision logging', entry + '\n---\n\n## Future decision logging', 1)
              decisions_path.write_text(decisions)

          next_path = Path('docs/NEXT.md')
          next_text = next_path.read_text()
          bullet = '- clarified the Method information hierarchy: the five-step list now carries the explanation and expands only the active row, while the technical face is reduced to a quiet grid, split comparison and cursor-drawn figure'
          if bullet not in next_text:
              anchor = '- moved the Method tracer from drag to Method-row hover/focus: each row now redraws its technical geometry from a genuinely blank technical substrate, while drag remains dedicated to the photo ↔ engineering split'
              if anchor in next_text:
                  next_text = next_text.replace(anchor, anchor + '\n' + bullet, 1)
              else:
                  next_text += '\n' + bullet + '\n'
          next_path.write_text(next_text)
          PY

      - name: Validate
        shell: bash
        run: |
          node --check approach-drag-inspection.js
          ! grep -q 'PROFILS SPORTS / PROJECT SYSTEM' approach-drag-inspection.js
          ! grep -q 'stageLabel.textContent' approach-drag-inspection.js
          grep -q 'project-system__summary' index.html
          grep -q 'data-approach-row tabindex="0"' index.html
          grep -q 'approach-drag-inspection.css?v=20260904-4' index.html
          grep -q 'approach-drag-inspection.js?v=20260904-4' index.html
          grep -q 'catalogue-ribbon' index.html
          git diff --check

      - name: Commit synchronized hierarchy refinement
        shell: bash
        run: |
          git config user.name 'Profils Sports Agent'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add approach-drag-inspection.js approach-drag-inspection.css index.html docs/DECISIONS.md docs/NEXT.md
          git commit -m 'feat: clarify method content hierarchy'
          git push origin HEAD:feat/method-content-hierarchy-v2
