name: Finalize Method Drag Tracer

on:
  push:
    branches:
      - feat/method-drag-tracer
    paths:
      - '.github/workflows/finalize-method-drag-tracer.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/method-drag-tracer
          fetch-depth: 0

      - name: Finalize integration
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          index = Path('index.html')
          text = index.read_text()
          text = text.replace('approach-drag-inspection.css?v=20260904-1', 'approach-drag-inspection.css?v=20260904-2')
          text = text.replace('approach-drag-inspection.js?v=20260904-1', 'approach-drag-inspection.js?v=20260904-2')
          index.write_text(text)

          decisions_path = Path('docs/DECISIONS.md')
          decisions = decisions_path.read_text()
          marker = '## 2026-09-04 — Every Method drag replays the technical tracer'
          if marker not in decisions:
              entry = '''\n---\n\n## 2026-09-04 — Every Method drag replays the technical tracer\n\nDecision:\n\nAdd a localized signal-yellow drawing cursor to the Method hover + drag inspection. Each new drag gesture starts a fresh drawing pass over the technical geometry of the currently active Method state.\n\nImplementation:\n\n- `pointerdown` resets and starts the tracer from the beginning\n- the tracer follows the actual authored geometry for field, structure, flow, delivery and maintenance states\n- disconnected paths use short curved pen-up transfers so the cursor does not teleport\n- the technical overlay is drawn progressively with SVG stroke-dash animation while the underlying blueprint remains visible\n- releasing or cancelling the drag fades the tracer out and resets it, so the next drag always replays from zero\n- changing Method while dragging rebuilds the route and restarts the tracer for the newly active state\n- the global directional site cursor is not modified\n- mobile and `prefers-reduced-motion` keep the static fallback\n\nRationale:\n\nThe split comparison already communicates project versus engineering. Replaying a precise construction cursor only during active drag adds authored motion and reinforces the engineering metaphor without adding another permanent animation layer.\n'''
              decisions = decisions.replace('\n---\n\n## Future decision logging', entry + '\n---\n\n## Future decision logging', 1)
              decisions_path.write_text(decisions)

          next_path = Path('docs/NEXT.md')
          next_text = next_path.read_text()
          bullet = '- added a replayable signal-yellow Method tracer: every new drag redraws the active technical geometry with a dedicated cursor, curved pen-up transfers and a clean reset on drag release'
          if bullet not in next_text:
              anchor = '- replaced the rejected liquid Method reveal with a precise hover + drag project/engineering split: a signal-yellow divider directly compares the photo with stage-specific technical drawings and keeps the original static fallback'
              if anchor in next_text:
                  next_text = next_text.replace(anchor, anchor + '\n' + bullet, 1)
              else:
                  next_text += '\n' + bullet + '\n'
          stale = '- transformed the Method visual into a localized liquid engineering inspection surface: the real project image stays visible while a spring-driven SDF membrane reveals stage-specific technical blueprints beneath the pointer, with static fallback and off-screen/idle RAF suspension\n'
          next_text = next_text.replace(stale, '')
          next_path.write_text(next_text)
          PY

      - name: Validate
        shell: bash
        run: |
          node --check approach-drag-inspection.js
          grep -q 'approach-drag-trace__cursor' approach-drag-inspection.js
          grep -q 'startTrace();' approach-drag-inspection.js
          grep -q 'stopTrace(false);' approach-drag-inspection.js
          grep -q 'approach-drag-inspection.css?v=20260904-2' index.html
          grep -q 'approach-drag-inspection.js?v=20260904-2' index.html
          grep -q 'Every Method drag replays the technical tracer' docs/DECISIONS.md
          git diff --check

      - name: Commit finalization
        shell: bash
        run: |
          git config user.name 'Profils Sports Agent'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html docs/DECISIONS.md docs/NEXT.md
          git commit -m 'docs: finalize method drag tracer integration'
          git push origin HEAD:feat/method-drag-tracer
